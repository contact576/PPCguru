<!doctype html><html><head><meta charset="utf-8"><style>
    *{margin:0;box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    .card{position:absolute;top:0;left:0;width:1200px;height:630px;overflow:hidden;
      font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      background:linear-gradient(125deg,#12294a 0%,#1c3a63 55%,#215891 100%);color:#fff;padding:50px 60px;
      display:flex;flex-direction:column;justify-content:space-between;}
    .top{display:flex;justify-content:space-between;align-items:center;}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:30px;}
    .dot{width:30px;height:30px;border-radius:8px;background:#1f6feb;display:inline-block;}
    .tag{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 18px;font-size:15px;
      text-transform:uppercase;letter-spacing:1px;font-weight:700;color:#cfe0f4;}
    .mid .client{color:#8fc4ff;font-weight:800;font-size:24px;}
    h1{font-size:42px;line-height:1.13;font-weight:800;margin-top:10px;max-width:1040px;letter-spacing:-.5px;}
    .bottom{display:flex;justify-content:space-between;align-items:flex-end;}
    .tiles{display:flex;gap:22px;}
    .t{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-top:4px solid #1a9e5f;
      border-radius:14px;padding:14px 22px;min-width:180px;}
    .t .v{font-size:38px;font-weight:800;line-height:1;}
    .t .l{font-size:13.5px;color:#bcd4ef;margin-top:7px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
    .site{color:#bcd4ef;font-size:20px;font-weight:700;padding-bottom:6px;}
    </style></head><body><div class="card"><div class="top"><div class="brand"><span class="dot"></span>PPC&nbsp;Guru</div><div class="tag">Meta Ads Case Study</div></div><div class="mid"><div class="client">EcoCare · HVAC &amp; Home Comfort</div><h1>How an HVAC Company Scaled to ~396 Meta Ads Leads a Month</h1></div><div class="bottom"><div class="tiles"><div class="t"><div class="v">~396</div><div class="l">Leads / month</div></div><div class="t"><div class="v">~$26</div><div class="l">Cost per lead</div></div><div class="t"><div class="v">~12×</div><div class="l">Lead growth</div></div></div><div class="site">ppcguru.ca</div></div></div></body></html>
